<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAttend - Login</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .login-logo {
      width: 55px;
      height: 55px;
      background: #2563eb;
      color: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      margin: 0 auto 15px;
    }

    .login-card h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .role-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #dbe2ea;
      background: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .role-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .demo {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <div class="login-logo">SA</div>

    <h1>SmartAttend</h1>

    <p class="login-subtitle">
      Smart Attendance Management System
    </p>

    <div class="role-buttons">
      <button class="role-btn active" onclick="selectRole('student', this)">
        Student
      </button>

      <button class="role-btn" onclick="selectRole('faculty', this)">
        Faculty
      </button>

      <button class="role-btn" onclick="selectRole('admin', this)">
        Admin
      </button>
    </div>

    <div id="error" class="error">
      Invalid username or password.
    </div>

    <form onsubmit="login(event)">

      <div class="input-group">
        <label>Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >
      </div>

      <button class="login-btn" type="submit">
        Login
      </button>

    </form>

<script>
  let selectedRole = "student";

  function selectRole(role, button) {
    selectedRole = role;

    document.querySelectorAll(".role-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");
  }

  function login(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const error = document.getElementById("error");

    const accounts = {
      student: {
        username: "student",
        password: "student123"
      },

      faculty: {
        username: "faculty",
        password: "faculty123"
      },

      admin: {
        username: "admin",
        password: "admin123"
      }
    };

    const account = accounts[selectedRole];

    if (
      username === account.username &&
      password === account.password
    ) {
      localStorage.setItem("userRole", selectedRole);
      localStorage.setItem("username", username);

      window.location.href = "/dashboard";
    } else {
      error.style.display = "block";
    }
  }
</script>

</body>
</html>
