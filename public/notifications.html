<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notifications - SmartAttend</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #222;
      padding: 25px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .header {
      background: #1f4e79;
      color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin-bottom: 8px;
    }

    .notification {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      border-left: 6px solid #dc3545;
    }

    .notification.safe {
      border-left-color: #198754;
    }

    .notification h3 {
      margin-bottom: 8px;
    }

    .notification p {
      color: #555;
      line-height: 1.5;
    }

    .date {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
    }

    .back-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 18px;
      background: #1f4e79;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🔔 Notifications</h1>
    <p>Smart attendance alerts</p>
  </div>

  <div id="notificationArea"></div>

  <a href="/history.html" class="back-btn">
    ← Back to Attendance History
  </a>

</div>


<script>

  let totalClasses = 120;
  let presentClasses = 94;
  let absentClasses = 26;

  const savedData =
    localStorage.getItem("lastAttendance");

  if (savedData) {

    const data = JSON.parse(savedData);

    totalClasses = data.total;
    presentClasses = data.present;
    absentClasses = data.absent;
  }


  const percentage =
    (presentClasses / totalClasses) * 100;


  const notificationArea =
    document.getElementById("notificationArea");


  if (percentage < 75) {

    notificationArea.innerHTML = `

      <div class="notification">

        <h3>⚠️ Low Attendance Warning</h3>

        <p>
          Your current attendance is
          <strong>${percentage.toFixed(1)}%</strong>.
          Your attendance is below the required 75%.
          Please attend upcoming classes regularly.
        </p>

        <div class="date">
          SmartAttend Alert
        </div>

      </div>

      <div class="notification">

        <h3>📢 Attendance Reminder</h3>

        <p>
          Please improve your attendance to avoid
          shortage of attendance.
        </p>

        <div class="date">
          SmartAttend
        </div>

      </div>

    `;

  } else {

    notificationArea.innerHTML = `

      <div class="notification safe">

        <h3>✅ Attendance Status Good</h3>

        <p>
          Your current attendance is
          <strong>${percentage.toFixed(1)}%</strong>.
          You are currently above the required 75%.
        </p>

        <div class="date">
          SmartAttend
        </div>

      </div>

    `;

  }

</script>

</body>
</html>
